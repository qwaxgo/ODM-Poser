name: 意見箱 / Feedback
description: 要望・感想・使いにくい所など、なんでも / Ideas, wishes, anything that felt awkward
title: "[意見] "
labels: ["feedback"]
body:
  - type: textarea
    id: opinion
    attributes:
      label: ご意見 / Your feedback
      description: 日本語でも英語でも / Japanese or English
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 使っている端末・ブラウザ（任意） / Device and browser (optional)
      placeholder: 例 / e.g. iPad + Safari, Windows + Edge, ComfyUI

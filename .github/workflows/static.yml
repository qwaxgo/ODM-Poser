# Build the site with Astro and publish it to GitHub Pages.
# Address: https://apps.qwaxgo.com/ODM-Poser/ (editor/: the editor, docs/: the docs from docs/*.md)
# web/ goes out as it is (Astro's publicDir); src/pages makes the pages.
name: Deploy the editor to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["web/**", "src/**", "docs/**", "astro.config.mjs", "package.json", "package-lock.json", ".github/workflows/static.yml"]
  workflow_dispatch:                                     # can also be run by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}editor/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the site (dist/)
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
